services:
  nginx:
    image: nginx:alpine
    container_name: iot-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"

  backend:
    build: ./backend
    container_name: iot-backend
    restart: unless-stopped
    depends_on:
      - mosquitto

  device-simulator:
    build: ./device-simulator
    container_name: device-simulator
    restart: unless-stopped
    depends_on:
      - mosquitto

  frontend:
    build: ./frontend
    container_name: iot-frontend
    restart: unless-stopped
    depends_on:
      - backend
